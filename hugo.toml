baseURL = 'https://eple-lab.github.io/'
locale = 'ko-kr'
defaultContentLanguage = 'ko'
title = 'espace eple'
theme = 'hextra'
# Dates without an offset (e.g. 2026-10-26 14:23:05) are Korean time
timeZone = 'Asia/Seoul'

enableRobotsTXT = true
enableGitInfo = true
hasCJKLanguage = true
enableInlineShortcodes = true

# The writing page is local only; config/development/hugo.toml brings it back for `hugo server`
ignoreFiles = ['write\.md$']

# date: when the post was first written (used for ordering)
# lastmod: set by hand only when the content really changed; falls back to date
[frontmatter]
  lastmod = ['lastmod', 'date']

# Blog posts are grouped by categories and tags
[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
[markup.highlight]
  noClasses = false
[markup.goldmark.renderer]
  unsafe = true

# config/development/hugo.toml repeats this menu (plus the local writing page); keep both in sync
[menu]
[[menu.main]]
  name = 'About'
  pageRef = '/about'
  weight = 1
[[menu.main]]
  name = 'Docs'
  pageRef = '/docs'
  weight = 2
[[menu.main]]
  name = 'Blog'
  pageRef = '/blog'
  weight = 3
[[menu.main]]
  name = 'Search'
  weight = 6
  [menu.main.params]
    type = 'search'
[[menu.main]]
  name = 'Theme'
  weight = 7
  [menu.main.params]
    type = 'theme-toggle'
[[menu.main]]
  name = 'GitHub'
  url = 'https://github.com/eple-lab'
  weight = 8
  [menu.main.params]
    icon = 'github'

[params]
  description = '공부하고 만든 것들을 기록하는 블로그'
  displayUpdatedDate = true
  dateFormat = '2006-01-02'

# Google Form for "Connect to eple" on the home page; empty shows "준비 중"
contactForm = 'https://forms.gle/DwmbbpCEJSkDK8LBA'

[params.navbar]
  displayTitle = true
  displayLogo = false

[params.theme]
  # light | dark | system
  default = 'dark'
  displayToggle = true

[params.footer]
  # Text (with Hugo/Hextra links) lives in i18n/ko.yaml under "copyright"
  displayCopyright = true
  displayPoweredBy = false

# Contact links on the right side of the footer
[[params.footer.links]]
  name = 'GitHub'
  url = 'https://github.com/eple-lab'
  icon = 'github'
[[params.footer.links]]
  name = 'Contact'
  url = '/#connect'
  icon = 'mail'

[params.search]
  enable = true
  type = 'flexsearch'

[params.editURL]
  enable = true
  base = 'https://github.com/eple-lab/eple-lab.github.io/edit/main/content'

[params.blog.list]
  displayTags = true
  sortBy = 'date'
  sortOrder = 'desc'
  pagerSize = 20

[params.highlight.copy]
  enable = true
  display = 'hover'
