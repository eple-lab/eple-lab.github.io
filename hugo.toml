baseURL = 'https://eple-lab.github.io/'
locale = 'ko-kr'
defaultContentLanguage = 'ko'
title = 'espace eple'
theme = 'hextra'

enableRobotsTXT = true
enableGitInfo = true
hasCJKLanguage = true
enableInlineShortcodes = true

# Blog posts are grouped by categories and tags
[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
[markup.highlight]
  noClasses = false
[markup.goldmark.renderer]
  unsafe = true

[menu]
[[menu.main]]
  name = '소개'
  pageRef = '/about'
  weight = 1
[[menu.main]]
  name = '문서'
  pageRef = '/docs'
  weight = 2
[[menu.main]]
  name = '블로그'
  pageRef = '/blog'
  weight = 3
[[menu.main]]
  name = '카테고리'
  pageRef = '/categories'
  weight = 4
[[menu.main]]
  name = '태그'
  pageRef = '/tags'
  weight = 5
[[menu.main]]
  name = 'Search'
  weight = 6
  [menu.main.params]
    type = 'search'
[[menu.main]]
  name = 'Theme'
  weight = 7
  [menu.main.params]
    type = 'theme-toggle'
[[menu.main]]
  name = 'GitHub'
  url = 'https://github.com/eple-lab'
  weight = 8
  [menu.main.params]
    icon = 'github'

[params]
  description = '공부하고 만든 것들을 기록하는 블로그'
  displayUpdatedDate = true
  dateFormat = '2006-01-02'

[params.navbar]
  displayTitle = true
  displayLogo = false

[params.theme]
  # light | dark | system
  default = 'dark'
  displayToggle = true

[params.footer]
  displayCopyright = false
  displayPoweredBy = true

[params.search]
  enable = true
  type = 'flexsearch'

[params.editURL]
  enable = true
  base = 'https://github.com/eple-lab/eple-lab.github.io/edit/main/content'

[params.blog.list]
  displayTags = true
  sortBy = 'date'
  sortOrder = 'desc'
  pagerSize = 20

[params.highlight.copy]
  enable = true
  display = 'hover'
