<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 40" fill="#14b8a6" role="img" aria-label="signal">
  <style>
    .s { animation: glow 5s ease-in-out infinite; }
    .s:nth-child(3n) { animation-duration: 6.5s; }
    .s:nth-child(4n) { animation-duration: 4.2s; }
    @keyframes glow { 0%, 100% { opacity: .9; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: .8; } }
  </style>
  <defs>
    <filter id="g" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#g)">
    <circle class="s" cx="20" cy="20" r="3" style="animation-delay:0s"/>
    <rect class="s" x="62" y="17" width="22" height="6" rx="3" style="animation-delay:.8s"/>
    <circle class="s" cx="138" cy="20" r="3" style="animation-delay:2.1s"/>
    <circle class="s" cx="160" cy="20" r="3" style="animation-delay:1.4s"/>
    <rect class="s" x="236" y="17" width="40" height="6" rx="3" style="animation-delay:3s"/>
    <circle class="s" cx="330" cy="20" r="3" style="animation-delay:.4s"/>
    <rect class="s" x="400" y="17" width="16" height="6" rx="3" style="animation-delay:2.6s"/>
    <circle class="s" cx="470" cy="20" r="3" style="animation-delay:1.9s"/>
    <rect class="s" x="520" y="17" width="30" height="6" rx="3" style="animation-delay:3.6s"/>
    <circle class="s" cx="580" cy="20" r="3" style="animation-delay:1.1s"/>
  </g>
</svg>
